name: Application Foundation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/test-supabase-foundation.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'eslint.config.mjs'
      - '.env.example'
      - '.github/workflows/application-foundation.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/test-supabase-foundation.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'eslint.config.mjs'
      - '.env.example'
      - '.github/workflows/application-foundation.yml'

permissions:
  contents: read

jobs:
  application-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:i18n
      - run: npm run test:app-foundation
      - run: npx tsc --noEmit
      - run: npm run build
      - run: git diff --check
