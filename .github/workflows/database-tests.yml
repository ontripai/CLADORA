name: Database tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"
      - "scripts/check-database-package.mjs"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"
      - "scripts/check-database-package.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/check-database-package.mjs

  postgres-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start clean local database and apply migrations
        run: supabase start
      - name: Run pgTAP database tests
        run: supabase test db
      - name: Run local database security and performance advisors
        run: supabase db lint --local --level warning
      - name: Show service status on failure
        if: failure()
        run: supabase status || true
